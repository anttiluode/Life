name: Validate LIFE offline game

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Determinism, saves, story and offline rendering
        run: node tests/life.test.cjs
      - name: Browser controller smoke test (virtual DOM)
        run: node tests/ui.test.cjs
      - name: Check offline generation scripts compile
        run: python -m py_compile tools/offline_art.py tools/offline_narrator.py
